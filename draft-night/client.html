async function join(){if(busy)return;busy=true;try{var c=$('#roomcode').value.trim().toUpperCase();var d=await api('join',{code:c,name:identity});token=d.token;room=d.code;player=d.player;localStorage.setItem('draft-night-session',JSON.stringify({room:room,player:player,token:token}));await refresh()}catch(e){err(e)}finally{busy=false}}
async function action(type,value){if(busy||!snapshot)return;busy=true;document.querySelectorAll('.arena-control button,.arena-next').forEach(function(b){b.disabled=true});try{var d=await api('action',{code:room,player:player,token:token,revision:snapshot.revision,type:type,value:value});if(room===d.code){snapshot=d;renderRoom()}}catch(e){await refresh();err(e)}finally{busy=false;if(snapshot)renderRoom()}}
async function refresh(){if(!room||refreshing)return;refreshing=true;var requested=room;try{var d=await api('room?code='+encodeURIComponent(requested));if(room!==requested||snapshot&&d.revision<snapshot.revision)return;var changed=JSON.stringify(snapshot)!==JSON.stringify(d);snapshot=d;if(d.itemDeck&&themes[d.theme])themes[d.theme].items=d.itemDeck;if(d.theme==='custom'&&d.customItems){themes.custom={name:d.customTitle||'Your World',desc:'An AI-generated auction just for you.',cover:'',items:d.itemDeck||d.customItems};}if(changed)renderRoom()}catch(e){if(room!==requested)return;if(e.message==='Room not found'){leave();err('This room has expired. Start a new draft.')}else err('Connection interrupted. Retrying…')}finally{refreshing=false}}
function session(){return '<div class="topline"><span class="small">ROOM <b style="color:#f5d18e;letter-spacing:2px">'+safe(room)+'</b></span><button class="link" onclick="share()">Share invite ↗</button></div>'}
async function share(){var u=location.origin+'/?room='+encodeURIComponent(room);if(navigator.share){try{await navigator.share({title:'Draft Night',text:'Join my auction draft!',url:u})}catch(e){}}else{try{await navigator.clipboard.writeText(u);alert('Invite link copied!')}catch(e){prompt('Copy invite link',u)}}}

var houseIcons=['🏊','🎬','⚽','🎮','🌇','🏋️','♨️','🎾','🍷','🏝️'];
function estate(p,mini){var its=p.items||[];return '<div class="'+(mini?'estate-mini':'')+'"><div class="estate"><div class="drive"></div><div class="housebody"><div class="roofline"></div></div><div class="buildinglabel">THE ORIGINAL HOUSE</div>'+its.map(function(x){var i=x.index;return '<div class="upgrade s'+i+'" title="'+safe(themes.house.items[i][0])+'"><b>'+houseIcons[i]+'</b><span>'+safe(themes.house.items[i][0])+'</span></div>'}).join('')+'</div></div>'}
function estatesPanel(){if(!snapshot||snapshot.theme!=='house')return '';return '<div class="estate-head"><h3>Building your worlds</h3><span class="rule-tag">5 upgrades each</span></div><div class="cols">'+snapshot.players.map(function(p,i){return '<div><div class="topline"><strong>'+(i===player?'Your home':'Rival’s home')+'</strong><span class="mini">'+p.items.length+'/'+(s.quotas[i]||5)+'</span></div>'+estate(p,true)+'</div>'}).join('')+'</div>'}

var badges={
house:['🏊','🎬','⚽','🎮','🌇','🏋️','♨️','🎾','🍷','🏝️'],
holiday:['🛥️','🚁','🍽️','🦒','🤿','⛵','🧖','🎈','🎤','🏝️'],
fast:['🍟','🍗','🍔','🌶️','🌮','🥪','🍕','🍔','👑','🥐'],
countries:['🗻','🍝','🏝️','🗽','🏛️','🏔️','🥁','🐘','🦘','🌋'],
sports:['⚽','🏎️','🏀','🎾','⛳','🏏','🥊','🏉','⛷️','🏊']};
badges.custom=['✨','🎭','🏗️','🪄','🚀','🎪','🎯','👑','🎲','🌟'];
var jokes={house:[['Mouldy Shed','photo-1473448912268-2022ce9509d8','A damp garden shed','🪵']],holiday:[['Airport Coach Transfer','photo-1509749837427-ac94a2553d0e','Three hours on a packed coach','🚌']],fast:[['Soggy Service Station Sandwich','photo-1553909489-cd47e0ef937f','The saddest sandwich','🥪']],countries:[['Airport Layover','photo-1436491865332-7a61a109cc05','Eight hours at the terminal','🧳']],sports:[['Competitive Queueing','photo-1529156069898-49953e39b3ac','A world-class wait','🧍']]};
function itemAt(s,i){return s.itemDeck?s.itemDeck[i]:themes[s.theme].items[i]}
function worldIcon(s,i){var name=itemAt(s,i)[0].toLowerCase();if(/pool|lake|scuba/.test(name))return '🏊';if(/yacht|boat|cruise|pedalo/.test(name))return '🛥️';if(/pitch|football/.test(name))return '⚽';if(/island|beach/.test(name))return '🏝️';if(/safari|jungle/.test(name))return '🌴';if(/helicopter/.test(name))return '🚁';if(/cinema/.test(name))return '🎬';if(/terrace|dinner|chef/.test(name))return '🍽️';if(/balloon/.test(name))return '🎈';return (badges[s.theme]||badges.custom)[i%10]}
function imageTag(it,cl){return '<div class="photo-frame '+(cl||'')+'">'+(it[1]?'<img src="'+safe(photo(it[1],800))+'" alt="'+safe(it[0])+'" onerror="this.remove();this.parentNode.classList.add(\'unavailable\')">':'')+'<span class="photo-fallback">Photo unavailable</span></div>'}
function worldArt(s,p,idx){return '<div class="collection-grid">'+(p.items.length?p.items.map(function(x){var it=itemAt(s,x.index);return '<figure>'+imageTag(it)+'<figcaption>'+safe(it[0])+'<small>'+(x.price?'£'+x.price:'Free')+'</small></figcaption></figure>'}).join(''):'<div class="collection-empty">Your collection starts with your first win.</div>')+'</div>'}
function scoreboard(s){return '<div class="scoreboard" style="--players:'+s.players.length+'">'+s.players.map(function(p,i){return '<div class="score '+(i===player?'is-you':'')+'"><strong>'+safe(p.name)+'</strong><b>£'+p.budget+'</b><span>'+p.items.length+'/'+(s.quotas[i]||Math.floor(10/s.capacity)+(i<10%s.capacity?1:0))+' items</span></div>'}).join('')+'</div>'}
function chooseCollection(i){collectionPlayer=i;renderRoom()}
function collectionTabs(s){return '<div class="collection-tabs" role="tablist">'+s.players.map(function(p,i){return '<button role="tab" aria-selected="'+(collectionPlayer===i)+'" onclick="chooseCollection('+i+')">'+safe(p.name)+'</button>'}).join('')+'</div>'}
function miniSlots(count){return '<div class="slots">'+Array.from({length:5},function(_,i){return '<i class="'+(i<count?'owned':'')+'"></i>'}).join('')+'</div>'}
function toggleNarration(){narration=!narration;if(!narration&&window.speechSynthesis)window.speechSynthesis.cancel();if(snapshot)renderRoom()}
function announceAuction(s){if(!narration||!window.speechSynthesis)return;var token=s.code+':'+s.round+':'+s.phase;if(token===lastAnnounced)return;lastAnnounced=token;var item=itemAt(s,s.round)[0];var words=s.phase==='sold'?s.players[s.wonBy].name+' takes '+item+' for '+s.soldFor+' pounds!': 'Round '+(s.round+1)+'. Up next, '+item+'. Place your bids!';try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(words);u.rate=1.12;u.pitch=.92;window.speechSynthesis.speak(u)}catch(e){}}
function renderArena(s,theme){announceAuction(s);var item=itemAt(s,s.round),me=s.players[player],sold=s.phase==='sold',leading=s.leader===player,canBid=!s.passed[player]&&!leading&&me.items.length<s.quotas[player];var label=sold?(s.soldFor===0?'Allocated free to ':'Sold to ')+s.players[s.wonBy].name:s.leader===null?'Opening bid':s.players[s.leader].name+' leads';var controls=sold?(player===0?'<button class="arena-next" onclick="action(\'next\')">'+(s.round===9?'See final collections':'Reveal next item')+' →</button>':'<div class="arena-note">Waiting for the host to reveal the next item.</div>'):'<div class="arena-control">'+[1,2,5].map(function(n){return '<button '+(!canBid||s.bid+n>me.budget?'disabled':'')+' onclick="action(\'bid\','+(s.bid+n)+')">Bid £'+(s.bid+n)+'</button>'}).join('')+'<button '+(!canBid?'disabled':'')+' onclick="action(\'pass\')">Pass</button></div>';$('#app').innerHTML='<div class="arena premium"><header class="arena-head"><div class="logo">Draft Night</div><span class="arena-round">'+(s.round+1)+' / 10</span><button class="link" onclick="toggleNarration()">Sound '+(narration?'on':'off')+'</button></header>'+scoreboard(s)+'<div class="auction-stage">'+imageTag(item,'lot-photo')+'<div class="lot-copy"><span class="eyebrow">'+safe(theme.name)+'</span><h1>'+safe(item[0])+'</h1><p>'+safe(item[2])+'</p></div></div><div class="bid-line" aria-live="polite"><div><span>'+safe(label)+'</span><small>'+(sold?'Collection updated':leading?'Your bid is committed':s.passed[player]?'You have passed':'Only the winner pays')+'</small></div><strong>£'+s.bid+'</strong></div>'+controls+'<div class="collection-label">Collections <span>Tap a name to inspect</span></div>'+collectionTabs(s)+'<div class="auction-collection">'+worldArt(s,s.players[collectionPlayer]||me,collectionPlayer)+'</div><div class="arena-note">'+(s.cpu?'Your pace. Each next item waits for you.':'Room '+safe(s.code)+' · '+s.players.length+' players')+'</div></div>'}
function renderEnd(s,theme){var p=s.players[collectionPlayer]||s.players[0];$('#app').innerHTML='<div class="arena premium final"><header class="arena-head"><div class="logo">Draft Night</div><span class="arena-round">Complete</span></header>'+scoreboard(s)+'<div class="final-title"><span class="eyebrow">'+safe(theme.name)+'</span><h1>The final collections.</h1></div>'+collectionTabs(s)+'<div class="final-collection">'+worldArt(s,p,collectionPlayer)+'</div><div class="verdict" aria-live="polite">'+safe(s.aiVerdict||'The judge is comparing your collections…')+'</div><div class="end-buttons"><button class="arena-next" onclick="leave()">Play again</button><button class="secondary" onclick="sharePoster()">Share collection</button></div></div>'}
function personCards(){return '<div class="players">'+snapshot.players.map(function(p,i){return '<div class="player '+(i===player?'active':'')+'"><div class="small">'+(i===0?'HOST':'CHALLENGER')+(i===player?' · YOU':'')+'</div><strong>'+safe(p.name)+'</strong><div class="wallet">£'+p.budget+'</div><div class="mini">'+p.items.length+' wins</div></div>'}).join('')+'</div>'}
function compactLobby(s,theme,ready){var host=player===0;$('#app').innerHTML='<div class="compact-lobby"><div class="arena-head"><div class="logo">✦ Draft Night</div><span class="arena-round">'+(ready?'READY TO PLAY':'WAITING ROOM')+'</span></div><div class="lobby-picture" style="background-image:url('+photo(theme.cover,700)+')"><span>'+safe(theme.name)+'</span></div><div class="lobby-room"><div><div class="eyebrow">ROOM CODE</div><strong>'+safe(room)+'</strong></div><button class="secondary" onclick="share()">Share invite ↗</button></div><div class="players">'+s.players.map(function(p,i){return '<div class="player '+(i===player?'active':'')+'"><div class="small">'+(i===0?'HOST':'CHALLENGER')+'</div><strong>'+safe(p.name)+'</strong><div class="wallet">£'+p.budget+'</div><div class="mini">'+(i===player?'You':'Joined')+'</div></div>'}).join('')+'</div><p class="lobby-help">'+(ready?'10 surprise items. Ten items divided among players.': ''+s.joined+' of '+s.capacity+' players joined.')+'</p><div class="lobby-actions">'+(ready?(host?btn('Start the auction →',"action('start')",'primary'):'<div class="notice">Waiting for the host to start.</div>'):btn('Copy invite link','share()','primary'))+'<button class="home-join" onclick="leave()">Leave room</button></div></div>'}
function renderRoom(){if(!snapshot)return;var s=snapshot,theme=themes[s.theme]||themes.house;if(s.status==='waiting'){view='waiting';compactLobby(s,theme,false);return;$('#app').innerHTML=header('THE LOBBY')+session()+'<h1 class="hero">Let the bidding<br><span class="spark">begin.</span></h1><div class="feature" style="height:200px;background-image:url('+photo(theme.cover,850)+')"><div class="inner"><h2>'+safe(theme.name)+'</h2><p>10 surprise items · £'+snapshot.startingBudget+' each · 5 wins each</p></div></div><div class="card"><div class="eyebrow">Your room code</div><div class="roomid">'+safe(room)+'</div>'+personCards()+'</div><div class="notice">'+(player===0?'Send the code or invite link to your friend. The game starts when he joins.':'Waiting for the host to start.')+'</div>'+btn('Copy invite link','share()','primary')+'<div style="height:10px"></div>'+btn('Leave room','leave()');return}
if(s.status==='ready'){view='ready';compactLobby(s,theme,true);return;$('#app').innerHTML=header('READY TO PLAY')+session()+'<h1 class="hero">It’s <span class="spark">on.</span></h1><p class="lead">Ten items will appear one at a time. Bid as much as you dare. You only pay when you win.</p>'+personCards()+'<div class="card"><div class="eyebrow">The rules</div><div class="itemrow">01 &nbsp; Each player starts with £20.</div><div class="itemrow">02 &nbsp; Highest bid gets the item.</div><div class="itemrow">03 &nbsp; Pass if you do not want the item. If you are the only player with cash, passing gifts it to your rival.</div><div class="itemrow">04 &nbsp; Five items each. If one player is full, remaining items go to the other for free.</div></div>'+(player===0?btn('Reveal first item →','action(\'start\')','primary'):'<div class="notice">Waiting for the host to reveal the first item.</div>');return}
if(s.status==='finished'){view='finished';renderEnd(s,theme);return;var a=s.players[0],b=s.players[1],winner=a.items.length===b.items.length?'The verdict is yours':a.items.length>b.items.length?a.name+' collected more':b.name+' collected more';$('#app').innerHTML=header('THE FINAL DRAFT')+'<div class="eyebrow" style="text-align:center">The auction has ended</div><h1 class="resultTitle">The final reveal ✦</h1><p class="lead" style="text-align:center">Who built the better '+safe(theme.name.toLowerCase())+'? Compare your drafts and decide.</p><div class="cols">'+s.players.map(function(p,i){return '<div class="card" style="margin:0;padding:12px"><div class="eyebrow">'+(i===player?'YOU':'RIVAL')+'</div><h3>'+safe(p.name)+'</h3><div class="wallet">£'+p.budget+' left</div><div class="mini">'+p.items.length+' items won</div>'+(s.theme==='house'?estate(p,true):'')+p.items.map(function(x){var t=theme.items[x.index];return '<div class="itemrow"><div class="thumb" style="background-image:url('+photo(t[1],140)+')"></div><div class="name">'+safe(t[0])+'<div class="mini">£'+x.price+'</div></div></div>'}).join('')+'</div>'}).join('')+'</div><div class="notice" style="text-align:center;margin-top:19px">Most items: '+safe(winner)+'. Quality is subjective, so you two decide the overall winner!</div>'+btn('Play another draft →','leave()','primary')+'<div style="height:10px"></div>'+btn('Share your room','share()');return}
view='auction';renderArena(s,theme);return;var item=theme.items[s.round],bid=s.bid,leader=s.leader,me=s.players[player],other=s.players[1-player],passed=s.passed[player],st=s.phase;
var buttons='';if(st==='bidding'){buttons='<div class="bidding">'+[1,2,5].map(function(n){var target=bid+n;return '<button class="bidbtn" '+(passed||target>me.budget?'disabled':'')+' onclick="action(\'bid\','+target+')">+£'+n+'</button>'}).join('')+'</div>'+btn('Pass on this item','action(\'pass\')') }
var status=st==='sold'?'SOLD · '+safe(s.players[s.wonBy].name)+' wins for £'+s.soldFor:leader===null?'Bidding starts at £1':safe(s.players[leader].name)+' leads at £'+bid;
$('#app').innerHTML=header('LIVE AUCTION')+session()+'<div class="topline" style="margin-top:18px"><span class="round">'+safe(theme.name)+' · Round '+(s.round+1)+' of 10</span><span class="live">'+(st==='sold'?'SOLD':'● LIVE BIDDING')+'</span></div><div class="progress">'+Array.from({length:10},function(_,i){return '<i class="'+(i<=s.round?'done':'')+'"></i>'}).join('')+'</div><div class="auctionImage" style="background-image:url('+photo(item[1],1100)+')"></div><div class="auctionInfo"><div class="eyebrow">Item '+String(s.round+1).padStart(2,'0')+' / 10</div><h2>'+safe(item[0])+'</h2><p>'+safe(item[2])+'</p></div><div style="height:19px"></div>'+personCards()+estatesPanel()+'<div class="card" style="text-align:center"><div class="live">'+(st==='sold'?'Hammer down':'CURRENT HIGHEST BID')+'</div><div class="bidvalue">£'+bid+'</div><div class="status">'+status+'</div>'+(st==='bidding'?buttons:'')+'</div>'+(st==='sold'?(player===0?btn(s.round===9?'See the final draft →':'Reveal next item →','action(\'next\')','primary'):'<div class="notice">Waiting for the host to reveal the next item.</div>'):'<div class="notice">'+(passed?'You have passed. Waiting for the auction to resolve.':leader===player?'You’re leading. Your friend can raise or pass.':'Raise the bid or pass to your friend.')+'</div>')+'<div class="eyebrow" style="margin-top:26px">Recent results</div>'+(!s.history.length?'<div class="empty">The first win is still up for grabs.</div>':s.history.slice().reverse().slice(0,4).map(function(h){return '<div class="history"><span>'+safe(theme.items[h.index][0])+'</span><span class="price">'+safe(s.players[h.winner].name)+' · £'+h.price+'</span></div>'}).join(''))+'<div class="footer">Your cash only decreases when you win an item.</div>';
}
async function sharePoster(){if(!snapshot)return;var s=snapshot,p=s.players[collectionPlayer]||s.players[0],c=document.createElement('canvas');c.width=1000;c.height=240+p.items.length*190;var g=c.getContext('2d');g.fillStyle='#10191d';g.fillRect(0,0,c.width,c.height);g.fillStyle='#e8d4ac';g.font='36px Georgia';g.fillText('Draft Night · '+p.name,40,60);g.fillStyle='#fff';g.font='24px sans-serif';g.fillText('£'+p.budget+' remaining · '+p.items.length+' items',40,108);for(var j=0;j<p.items.length;j++){var x=p.items[j],it=itemAt(s,x.index),y=160+j*190;try{var im=await new Promise(function(ok,no){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){ok(img)};img.onerror=no;img.src=photo(it[1],400);setTimeout(no,5000)});g.drawImage(im,40,y,230,160)}catch(e){g.fillStyle='#263439';g.fillRect(40,y,230,160)}g.fillStyle='#fff';g.font='28px sans-serif';g.fillText(it[0],300,y+65,650);g.fillStyle='#d2c4a8';g.font='24px sans-serif';g.fillText(x.price?'£'+x.price:'Free allocation',300,y+108)}try{var blob=await new Promise(function(ok){c.toBlob(ok,'image/png')});var file=new File([blob],'draft-night-collection.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Draft Night collection'});else{var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}}catch(e){if(e.name!=='AbortError')shareResult()}}
async function shareResult(){if(!snapshot)return;var s=snapshot,theme=themes[s.theme];var summary='DRAFT NIGHT • '+theme.name+'\n'+s.players.map(function(p,i){return 'Player '+(i+1)+' (£'+p.budget+' left): '+p.items.map(function(x){return itemAt(s,x.index)[0]}).join(', ')}).join('\n')+'\n'+(s.aiVerdict||'Who wins? You decide.')+'\n'+location.origin;try{if(navigator.share){await navigator.share({title:'Draft Night · Final Reveal',text:summary})}else{await navigator.clipboard.writeText(summary);alert('Result copied!')}}catch(e){}}
function leave(){token='';collectionPlayer=0;room=null;snapshot=null;localStorage.removeItem('draft-night-session');renderHome()}
var urlRoom=new URLSearchParams(location.search).get('room');if(urlRoom){joinScreen();$('#roomcode').value=urlRoom.toUpperCase()}else{var saved=null;try{saved=JSON.parse(localStorage.getItem('draft-night-session'))}catch(e){}if(saved&&saved.room&&saved.token){room=saved.room;player=saved.player;token=saved.token||'';refresh()}else renderHome()}
poll=setInterval(function(){if(room)refresh()},1200);
</script></body></html>
