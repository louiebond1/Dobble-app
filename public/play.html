<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a3070" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dobble Party — Play</title>
  <link rel="preconnect" href="https://upload.wikimedia.org" />
  <link rel="preconnect" href="https://commons.wikimedia.org" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>💘 Our Favourite Things</h1>

    <div class="panel" id="joinPanel">
      <label for="codeInput">Room code</label>
      <input type="text" id="codeInput" maxlength="4" autocapitalize="characters" />
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" maxlength="20" placeholder="e.g. Lily" />
      <button class="btn" id="joinBtn">Join Game</button>
      <p id="joinError" style="color:#c0392b;"></p>
    </div>

    <div class="panel hidden" id="waitingPanel">
      <h2>You're in! 🎉</h2>
      <p id="waitingText">Waiting for the host to start...</p>
    </div>

    <div class="panel hidden" id="gameArea">
      <div class="top-bar">
        <div class="round-info">Round <span id="roundNum"></span> / <span id="totalRounds"></span></div>
        <div class="player-badge">
          <div class="avatar-dot" id="playerAvatar"></div>
          <span class="player-name" id="playerNameBadge"></span>
          <span class="player-score" id="playerScoreBadge">0</span>
        </div>
      </div>
      <div class="cards-wrap">
        <div class="card" id="cardA"></div>
        <div class="card" id="cardB"></div>
      </div>
    </div>

    <div class="panel hidden" id="gameOver">
      <div class="game-complete-emoji">🎉</div>
      <h2>Game Complete!</h2>
      <p class="rounds-completed"><span id="roundsCompletedCount"></span> rounds played</p>
      <div class="leaderboard" id="finalLeaderboard"></div>
    </div>
  </div>

  <div class="overlay hidden" id="resultOverlay">
    <div class="overlay-card">
      <div class="overlay-photo-frame" id="resultPhotoFrame"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultLabel"></p>
    </div>
  </div>

  <div class="countdown-overlay hidden" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/layout.js"></script>
  <script src="/play.js"></script>
</body>
</html>
