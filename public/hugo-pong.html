<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#4a3070" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hugo Pong — Our Favourite Things</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/hugo-pong.css" />
</head>
<body>
  <div id="gameWrap">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-top">
      <a href="/" class="hud-back">← Games</a>
      <div class="hud-title-wrap">
        <div class="hud-title">🍹 Hugo&nbsp;Pong</div>
        <div class="hud-tagline">SINK THE SPRITZ</div>
      </div>
      <button class="hud-sound-btn" id="soundToggleBtn" aria-label="Toggle sound">🔊</button>
    </div>

    <div class="hud-stats">
      <div class="hud-stat"><span class="hud-stat-label">Cups</span><span class="hud-stat-value" id="cupsStat">10/10</span></div>
      <div class="hud-stat"><span class="hud-stat-label">Throws</span><span class="hud-stat-value" id="throwsStat">0/10</span></div>
      <div class="hud-stat"><span class="hud-stat-label">Score</span><span class="hud-stat-value" id="scoreStat">0</span></div>
    </div>

    <div class="swipe-hint" id="swipeHint">
      <div class="swipe-hint-title">↑ SWIPE TO THROW</div>
      <div class="swipe-hint-sub">Drag back and release</div>
    </div>

    <div class="recipe-card">
      <div class="recipe-card-title">THE HUGO</div>
      <div class="recipe-card-item">🥂 Prosecco</div>
      <div class="recipe-card-item">🌸 Elderflower</div>
      <div class="recipe-card-item">🌿 Mint</div>
      <div class="recipe-card-item">🍈 Lime</div>
      <div class="recipe-card-item">💗 Good vibes</div>
    </div>

    <div class="result-toast hidden" id="resultToast"></div>

    <div class="intro-overlay" id="introOverlay">
      <div class="intro-title">🍹 Hugo Pong</div>
      <div class="intro-sub">Swipe to throw. Sink the spritz.</div>
      <button class="intro-start-btn" id="introStartBtn">Let's Go</button>
    </div>

    <div class="countdown-overlay hidden" id="countdownOverlay">
      <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <div class="overlay hidden" id="endOverlay">
      <div class="end-card">
        <div class="end-emoji">🍹</div>
        <h2>GAME OVER</h2>
        <div class="end-score" id="endScoreLine"></div>
        <div class="end-accuracy" id="endAccuracyLine"></div>
        <div class="end-verdict-title" id="endVerdictTitle"></div>
        <div class="end-verdict-sub" id="endVerdictSub"></div>
        <button class="btn" id="playAgainBtn">🔁 Play Again</button>
        <a href="/" class="btn btn-outline">← Back to Games</a>
      </div>
    </div>
  </div>

  <script src="/layout.js"></script>
  <script src="/hugo-pong.js"></script>
</body>
</html>
