<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a3070" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dobble Party — Memory Match</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap wrap-wide">
    <h1>🧠 Memory Match</h1>
    <p class="subtitle">All 57 favourites — find every pair</p>

    <div class="panel" id="setup">
      <label for="p1Input">Player 1</label>
      <input type="text" id="p1Input" maxlength="20" placeholder="e.g. Louie" />
      <label for="p2Input">Player 2</label>
      <input type="text" id="p2Input" maxlength="20" placeholder="e.g. Anna" />
      <button class="btn" id="startBtn">🧠 Deal the Board</button>
      <a href="/" class="btn btn-outline">← Back to Home</a>
    </div>

    <div class="panel hidden" id="memoryGameArea">
      <div class="memory-hud">
        <div class="memory-player" id="hudP1">
          <span class="memory-player-name" id="hudP1Name"></span>
          <span class="memory-player-score" id="hudP1Score">0</span>
        </div>
        <div class="memory-turn" id="memoryTurn">—</div>
        <div class="memory-player" id="hudP2">
          <span class="memory-player-name" id="hudP2Name"></span>
          <span class="memory-player-score" id="hudP2Score">0</span>
        </div>
      </div>
      <div class="memory-stats">
        <span id="memoryMoves">0 moves</span>
        <span id="memoryTimer">0:00</span>
        <span id="memoryFound">0 / 57 pairs</span>
      </div>
      <div class="memory-grid" id="memoryGrid"></div>
    </div>

    <div class="panel hidden" id="memoryOver">
      <div class="game-complete-emoji">🧠</div>
      <h2 id="memoryOverTitle">All Matched!</h2>
      <p class="rounds-completed" id="memoryOverSummary"></p>
      <div class="leaderboard" id="memoryFinalBoard"></div>
      <button class="btn" id="memoryPlayAgainBtn">🔁 Play Again</button>
      <a href="/" class="btn btn-outline">← Back to Home</a>
    </div>
  </div>

  <script src="/layout.js"></script>
  <script src="/memory.js"></script>
</body>
</html>
