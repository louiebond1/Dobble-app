<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a3070" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dobble Party — Memory Match</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-bg="blush" data-mount="string">
  <div class="wrap wrap-wide">
    <h1>🧠 Memory Match</h1>
    <p class="subtitle">Pick how many, then find every pair</p>

    <div class="panel" id="setup">
      <p class="field-label">Wall background</p>
      <div class="bg-swatches" id="bgSwatches">
        <button type="button" class="bg-swatch bg-swatch-blush active" data-bg="blush" aria-label="Blush"></button>
        <button type="button" class="bg-swatch bg-swatch-lilac" data-bg="lilac" aria-label="Lilac"></button>
        <button type="button" class="bg-swatch bg-swatch-cream" data-bg="cream" aria-label="Cream"></button>
        <button type="button" class="bg-swatch bg-swatch-sky" data-bg="sky" aria-label="Sky"></button>
        <button type="button" class="bg-swatch bg-swatch-peach" data-bg="peach" aria-label="Peach"></button>
        <label class="bg-swatch bg-swatch-upload" id="bgUploadSwatch" aria-label="Upload your own photo">
          <span>📷</span>
          <input type="file" id="bgUploadInput" accept="image/*" class="hidden" />
        </label>
      </div>
      <p class="bg-upload-hint hidden" id="bgUploadHint">Using your photo as the wall — pick a swatch to go back.</p>

      <p class="field-label">Hanging style</p>
      <div class="mount-select" id="mountSelect">
        <button type="button" class="mount-card active" data-mount="string">
          <span class="mount-card-icon">🪢</span>
          <span class="mount-card-text">
            <span class="mount-card-name">String &amp; Pegs</span>
            <span class="mount-card-desc">Cards hang from string on little pegs</span>
          </span>
        </button>
        <button type="button" class="mount-card" data-mount="pin">
          <span class="mount-card-icon">📌</span>
          <span class="mount-card-text">
            <span class="mount-card-name">Pinned</span>
            <span class="mount-card-desc">Cards pinned straight to the wall</span>
          </span>
        </button>
        <button type="button" class="mount-card" data-mount="shelf">
          <span class="mount-card-icon">🪵</span>
          <span class="mount-card-text">
            <span class="mount-card-name">Shelf</span>
            <span class="mount-card-desc">Cards lean upright on little wooden ledges</span>
          </span>
        </button>
      </div>

      <div class="mode-toggle" id="sourceToggle">
        <button type="button" class="mode-btn active" id="sourceFavouritesBtn" data-source="favourites">💕 Favourites</button>
        <button type="button" class="mode-btn" id="sourcePhotosBtn" data-source="photos">📸 Our Photos</button>
      </div>

      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn active" id="modeSoloBtn" data-mode="solo">🧍 Solo</button>
        <button type="button" class="mode-btn" id="modeDuoBtn" data-mode="duo">🧑‍🤝‍🧑 Head-to-Head</button>
      </div>

      <div class="pair-count-field">
        <label for="pairCountInput">How many pairs?</label>
        <div class="pair-chips" id="pairChips"></div>
        <input type="number" id="pairCountInput" min="4" max="57" value="12" />
      </div>

      <div id="soloFields">
        <label for="soloNameInput">Your name</label>
        <input type="text" id="soloNameInput" maxlength="20" placeholder="e.g. Louie" />
      </div>

      <div id="duoFields" class="hidden">
        <label for="p1Input">Player 1</label>
        <input type="text" id="p1Input" maxlength="20" placeholder="e.g. Louie" />
        <label for="p2Input">Player 2</label>
        <input type="text" id="p2Input" maxlength="20" placeholder="e.g. Anna" />
      </div>

      <button class="btn" id="startBtn">🧠 Deal the Board</button>
      <a href="/" class="btn btn-outline">← Back to Home</a>
    </div>
  </div>

  <div class="memory-stage hidden" id="memoryGameArea">
    <div class="memory-topbar">
      <a href="/memory" class="btn-back memory-quit">← Quit</a>
      <div class="memory-header-text">
        <span class="memory-title">🧠 Memory Match</span>
        <span class="memory-subtitle">Flip the cards. Find every pair.</span>
      </div>
    </div>
    <div class="memory-stats-bar">
      <span id="memoryMoves">0 moves</span>
      <span id="memoryTimer">0:00</span>
      <span id="memoryFound">0 / 10 pairs</span>
    </div>
    <div class="memory-hud hidden" id="memoryHud">
      <div class="memory-player" id="hudP1">
        <span class="memory-player-name" id="hudP1Name"></span>
        <span class="memory-player-score" id="hudP1Score">0</span>
      </div>
      <div class="memory-turn" id="memoryTurn">—</div>
      <div class="memory-player" id="hudP2">
        <span class="memory-player-name" id="hudP2Name"></span>
        <span class="memory-player-score" id="hudP2Score">0</span>
      </div>
    </div>
    <div class="memory-wall" id="memoryWall"></div>
  </div>

  <div class="memory-stage memory-stage-over hidden" id="memoryOver">
    <div class="memory-over-content">
      <div class="memory-over-emoji">🎉</div>
      <h2 id="memoryOverTitle">All memories found!</h2>
      <p class="memory-over-summary" id="memoryOverSummary"></p>
      <p class="memory-over-summary" id="memorySoloBest"></p>
      <div class="leaderboard" id="memoryFinalBoard"></div>
      <button class="btn" id="memoryPlayAgainBtn">💕 Play Again</button>
    </div>
  </div>

  <script src="/layout.js"></script>
  <script src="/memory.js"></script>
</body>
</html>
