<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#100e1b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Draft Night · Our Favourite Things</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#0b1020;color:#f8e6ce;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100dvh;display:flex;flex-direction:column}.top{height:calc(47px + env(safe-area-inset-top));min-height:calc(47px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#130f21;border-bottom:1px solid #473750;padding-top:env(safe-area-inset-top)}.back{font:600 13px -apple-system,sans-serif;text-decoration:none;color:#efc99c;background:#282238;border:1px solid #5c4755;border-radius:11px;padding:7px 10px}.brand{font-weight:750;letter-spacing:.1px;font-size:14px}.brand span{color:#e7b97b}.frame{flex:1;min-height:0;width:100%;border:0;background:#090e1c}.fallback{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));right:12px;font-size:11px;background:#1c213acc;color:#eed5b2;text-decoration:none;padding:6px 9px;border-radius:8px;border:1px solid #56475b;opacity:.72}@media(max-height:650px){.top{height:40px;min-height:40px}}.identity-bar{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:6px 12px;background:#151426}.identity-bar button{border:1px solid #5c5068;background:#26243a;color:#ebd8bc;border-radius:9px;padding:9px 3px;font-size:13px;font-weight:700}.identity-bar button.on{background:#e9c795;color:#211825;border-color:#f5dba8}@media(max-height:700px){.identity-bar button{padding:6px}}</style></head>
<body><main class="app"><header class="top"><a class="back" href="/">‹ Games</a><div class="brand"><span>Draft Night</span></div></header><div class="identity-bar"><button id="louie" onclick="choosePlayer('Louie')">I'm Louie</button><button id="ariel" onclick="choosePlayer('Ariel')">I'm Ariel</button></div><iframe id="draftFrame" class="frame" title="Draft Night, 2 to 5 player auction game" src="https://draft-night-web-production.up.railway.app/" allow="clipboard-write" loading="eager"></iframe></main>
<script>
function choosePlayer(name){
  localStorage.setItem('draft-night-person',name);
  document.getElementById('draftFrame').contentWindow.postMessage({type:'draft-night-identity',name:name},'https://draft-night-web-production.up.railway.app');
  document.getElementById('louie').classList.toggle('on',name==='Louie');
  document.getElementById('ariel').classList.toggle('on',name==='Ariel');
}
document.getElementById('draftFrame').addEventListener('load',function(){var n=localStorage.getItem('draft-night-person');if(n==='Louie'||n==='Ariel')choosePlayer(n)});
var saved=localStorage.getItem('draft-night-person');
if(saved==='Louie'||saved==='Ariel')choosePlayer(saved);
</script></body></html>
