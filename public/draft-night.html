<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#171126" />
    <meta name="referrer" content="no-referrer" />
    <title>Draft Night</title>
    <link rel="stylesheet" href="/draft2.css?v=2" />
    <link rel="stylesheet" href="/draft-premium.css?v=2" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header>
      <button class="nav-back" id="nav-back" aria-label="Back to Draft Night home" type="button">← <span>Back</span></button>
      <a class="wordmark" href="/draft-night.html?home=1" aria-label="Draft Night home"
        ><span class="brand-star">✳</span> DRAFT NIGHT<span class="edition"
          >02</span
        ></a
      >
      <div class="header-right">
        <span id="connection" class="live">READY TO PLAY</span
        ><button
          class="icon-button"
          id="sound"
          aria-label="Enable sound"
          title="Toggle sound"
        >
          ♪</button
        ><a class="exit" href="/">↗ Party</a>
      </div>
    </header>
    <main id="app"></main>
    <div id="toast" role="status"></div>
    <dialog id="modal">
      <button id="close-modal" class="icon-button" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </dialog>
    <script src="/draft2.js?v=3" defer></script>
    <script src="/draft-navigation.js?v=2" defer></script>
  </body>
</html>
