<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a3070" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dobble Party — Trial Mode</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://upload.wikimedia.org" />
  <link rel="preconnect" href="https://commons.wikimedia.org" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>🧪 Trial Mode</h1>
    <p class="subtitle">Practice a round with no score</p>

    <div class="panel">
      <div class="round-info">Round <span id="roundNum">0</span></div>
      <div class="cards-wrap">
        <div class="card" id="cardA"></div>
        <div class="card" id="cardB"></div>
      </div>
      <a href="/" class="btn btn-outline">← Back to Host</a>
    </div>
  </div>

  <div class="overlay hidden" id="resultOverlay">
    <div class="overlay-card">
      <div class="overlay-photo-frame" id="resultPhotoFrame"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultLabel"></p>
    </div>
  </div>

  <div class="countdown-overlay hidden" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
  </div>

  <script src="/layout.js"></script>
  <script src="/trial.js"></script>
</body>
</html>
