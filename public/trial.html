<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Dobble Party — Trial Mode</title>
  <link rel="preconnect" href="https://upload.wikimedia.org" />
  <link rel="preconnect" href="https://commons.wikimedia.org" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>🧪 Trial Mode</h1>
    <p class="subtitle">Practice solo — tap the symbol both cards share</p>

    <div class="panel">
      <div class="round-info">Round <span id="roundNum">0</span> · <span id="feedback"></span></div>
      <div class="cards-wrap">
        <div class="card" id="cardA"></div>
        <div class="card" id="cardB"></div>
      </div>
      <a href="/" class="btn btn-outline">← Back to Host</a>
    </div>
  </div>

  <div class="countdown-overlay hidden" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
  </div>

  <script src="/layout.js"></script>
  <script src="/trial.js"></script>
</body>
</html>
