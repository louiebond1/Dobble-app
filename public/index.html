<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a3070" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dobble Party — Host</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://upload.wikimedia.org" />
  <link rel="preconnect" href="https://commons.wikimedia.org" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>💘 Our Favourite Things</h1>
    <p class="subtitle">Spot the match — scan to join on your phone</p>

    <div class="panel" id="setup">
      <label for="hostNameInput">Your name</label>
      <input type="text" id="hostNameInput" placeholder="e.g. Alex" maxlength="20" />
      <div class="rounds-field">
        <label for="roundsInput">Number of rounds</label>
        <input type="number" id="roundsInput" min="5" max="28" value="15" />
      </div>
      <button class="btn" id="createBtn">🎉 Create Game</button>
      <a href="/trial" class="btn btn-outline">🧪 Try Solo Trial Mode</a>
      <a href="/memory" class="btn btn-outline">🧠 Play Memory Match</a>
    </div>

    <div class="panel hidden" id="lobby">
      <div class="room-code" id="roomCode"></div>
      <img id="qrImg" alt="QR code to join" />
      <div class="join-url" id="joinUrlText"></div>
      <h3>Players (<span id="playerCount">0</span>)</h3>
      <ul id="playerList"></ul>
      <button class="btn" id="startBtn" disabled>Start Game</button>
      <p class="lobby-hint" id="lobbyHint">Waiting for at least one more player to join…</p>
    </div>

    <div class="panel hidden" id="gameArea">
      <div class="round-info">Round <span id="roundNum"></span> / <span id="totalRounds"></span></div>
      <div class="cards-wrap">
        <div class="card" id="cardA"></div>
        <div class="card" id="cardB"></div>
      </div>
      <div class="leaderboard" id="leaderboard"></div>
    </div>

    <div class="panel hidden" id="gameOver">
      <div class="game-complete-emoji">🎉</div>
      <h2>Game Complete!</h2>
      <p class="rounds-completed"><span id="roundsCompletedCount"></span> rounds played</p>
      <div class="leaderboard" id="finalLeaderboard"></div>
      <h3 class="all-time-heading">🏆 All-Time</h3>
      <div class="leaderboard" id="allTimeLeaderboard"></div>
      <button class="btn" id="playAgainBtn">🔁 Play Again</button>
    </div>
  </div>

  <div class="overlay hidden" id="resultOverlay">
    <div class="overlay-card">
      <div class="overlay-photo-frame" id="resultPhotoFrame"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultLabel"></p>
    </div>
  </div>

  <div class="countdown-overlay hidden" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/layout.js"></script>
  <script src="/host.js"></script>
</body>
</html>
