<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Country Memory</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f7f0df;color:#253b45}.cm{max-width:760px;margin:auto;padding:18px}.cm-card{background:#fffaf0;border:2px solid #d8cdb5;border-radius:22px;padding:18px;box-shadow:0 5px 0 #d5c6ae}.cm h1{font-family:Georgia,serif}.names,.actions{display:flex;gap:10px;flex-wrap:wrap}.names button,.actions button,.die{min-height:58px;padding:12px 18px;border:2px solid #285f4b;border-radius:14px;background:#fff;font-weight:800;font-size:18px}.names button.active,.actions button.primary{background:#285f4b;color:#fff}.art{width:100%;max-height:55vh;object-fit:contain;border-radius:16px}.timer{font-size:32px;font-weight:900;color:#b84e43}.hidden{display:none!important}.question{padding:14px;margin:8px 0;border:2px solid #d8cdb5;border-radius:14px;background:#fff;font-size:20px}.muted{color:#657279}
</style></head><body><main class="cm"><a href="/">← Back</a><h1>🌍 Country Memory</h1><p class="muted">Study the card, then roll and answer one of six questions.</p><section class="cm-card" id="setup"><h2>Who are you?</h2><div class="names"><button data-player="Louie">I'm Louie</button><button data-player="Ariel">I'm Ariel</button></div><p id="setupHint" class="muted">Choose your name to begin.</p></section><section class="cm-card hidden" id="study"><p><strong id="playerLabel"></strong> is studying</p><div class="timer" id="timer">30</div><img class="art" id="art" alt="Country study card"><h2 id="countryName"></h2><div id="captions"></div><div class="actions"><button class="primary" id="ready">I'm ready</button></div></section><section class="cm-card hidden" id="questions"><h2 id="questionTitle">Roll the die</h2><div class="actions"><button class="die primary" id="roll">🎲 Roll</button></div><div id="questionList"></div><div class="actions"><button id="next">Next card</button></div></section></main><script src="/country-memory.js"></script></body></html>
