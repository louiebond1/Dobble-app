# Local services only. Credentials here are local throwaway values, never for deployment.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bm
      POSTGRES_PASSWORD: bm
      POSTGRES_DB: bondmoran
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: bm
      POSTGRES_PASSWORD: bm
      POSTGRES_DB: bondmoran_test
    ports: ["5433:5432"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 localminio localminio-secret;
      mc mb --ignore-existing local/bondmoran-demo; mc anonymous set none local/bondmoran-demo; exit 0"
volumes:
  pgdata:
  miniodata:
